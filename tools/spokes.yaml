- name: dfw-site-selection-explorer
  kind: showcase
  description: Interactive ArcGIS Dashboard exploring candidate sites for a DFW regional distribution
    centre - scenario selector, ranked candidates, indicators and criterion-contribution charts.
  files:
  - from: LICENSE
    to: LICENSE
  dirs:
  - scripts
  - screenshots
  pending:
  - scripts/build_dashboard.py
  - scripts/publish_layers.py
  - screenshots/
- name: dfw-site-selection-cartography
  kind: showcase
