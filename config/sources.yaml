# =============================================================================
# Data source registry (scope Section 3).
#
# Every entry is loaded into the DataSourceRegistry table on ingest. All sources
# are free and public.
#
# `portal` is the canonical landing page and is stable. `endpoint` is the direct
# download URL and is NOT stable - portals reorganize. Entries carrying
# `verify_endpoint: true` must be confirmed against the live portal before the
# first download; IngestAndStandardize refuses to run on an unverified endpoint
# unless --allow-unverified is passed.
#
# `field_map` translates provider field names to the schema field names in
# config/schema.yaml. Parcel schemas differ per county, so S01 carries a
# per-county map (scope Section 14, parcel-data risk).
# =============================================================================

defaults:
  target_crs: 6584
  datum_transformation: null      # set per-source where the native datum differs
  download_dir: "{raw_dir}/{source_id}"

study_area:
  msa_name: "Dallas-Fort Worth-Arlington, TX"
  cbsa_code: "19100"              # [VERIFY against current OMB delineation on first TIGER pull]
  state_fips: "48"
  # 11 counties, 2023 OMB delineation. Hood and Somervell were removed from the
  # MSA in the 2023 update and are correctly absent here.
  counties:
    Collin:   "085"
    Dallas:   "113"
    Denton:   "121"
    Ellis:    "139"
    Hunt:     "231"
    Johnson:  "251"
    Kaufman:  "257"
    Parker:   "367"
    Rockwall: "397"
    Tarrant:  "439"
    Wise:     "497"
  context_buffer_miles: 15        # scope 2.1 - prevents truncated drive-time polygons
  store_search_radius_miles: 600  # scope 2.2

# =============================================================================
# Physical-filter layers for the Tarrant vertical slice.
#
# Every endpoint below was probed live on 2026-09-23 and is recorded with the
# feature count or coverage id observed. `acquisition: AUTO` means
# IngestAndStandardize can fetch it unattended.
#
# The slice is clipped to the Tarrant County boundary plus a small buffer, so
# a parcel on the county line is still judged against flood, wetland and
# utility geometry that continues past it.
# =============================================================================

slice:
  name: tarrant
  boundary_service: https://mapit.tarrantcounty.com/arcgis/rest/services/Dynamic/Tarrant_boundary/MapServer/0
  buffer_miles: 2
  # WGS84 envelope used for server-side spatial filters: xmin,ymin,xmax,ymax
  bbox_wgs84: "-97.65,32.45,-96.90,33.10"

physical_layers:

  flood:
    source_id: S13
    acquisition: AUTO
    target: FloodZones_NFHL
    service: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28
    provider: FEMA
    dataset: National Flood Hazard Layer - Flood Hazard Zones
    license: Public domain
    native_crs: 4326
    observed_features_in_slice: 20965
    # NFHL advertises maxRecordCount 2000 but returns HTTP 500 for a wide
    # geometry at 500 rows; 250 is the largest page it actually serves.
    # The downloader halves and retries anyway, but starting low avoids the
    # wasted round trips.
    page_size: 250
    out_fields: [FLD_ZONE, ZONE_SUBTY, SFHA_TF, DFIRM_ID, STATIC_BFE]
    # Recon 3: NFHL has no floodway field and SFHA_TF is "T"/"F" TEXT.
    derive:
      sfha_flag:     {from: SFHA_TF, equals: "T"}
      floodway_flag: {from: ZONE_SUBTY, contains: FLOODWAY}

  wetlands:
    source_id: S14
    acquisition: AUTO
    target: Wetlands_NWI
    service: https://www.fws.gov/wetlandsmapservice/rest/services/Wetlands/MapServer/0
    provider: US Fish and Wildlife Service
    dataset: National Wetlands Inventory
    license: Public domain
    native_crs: 4326
    observed_features_in_slice: 18335
    page_size: 1000
    # The FWS service serves the first couple of pages for the county envelope
    # and then times out at resultOffset 2000, at any page size. Tiling keeps
    # every request's extent small and its offset shallow.
    tiles: 8
    max_offset: 2000
    # Field names carry a "Wetlands." prefix because the layer is a join.
    out_fields: ["Wetlands.ATTRIBUTE", "Wetlands.WETLAND_TYPE", "Wetlands.ACRES"]
    field_map:
      attribute:    "Wetlands.ATTRIBUTE"
      wetland_type: "Wetlands.WETLAND_TYPE"

  water_ccn:
    source_id: S19
    acquisition: AUTO
    target: WaterCCN
    service: https://mapit.tarrantcounty.com/arcgis/rest/services/Transportation/WaterUtilityProvider2025/MapServer/0
    provider: Tarrant County GIS (PUC of Texas CCN data)
    dataset: Water Utility Providers 2025 (CCN bounded service areas)
    license: Public domain
    native_crs: 2276
    observed_features_in_slice: 127
    page_size: 1000
    out_fields: [CCN_NO, UTILITY, CCN_TYPE, STATUS, COUNTY]
    field_map:
      ccn_no:       CCN_NO
      utility_name: UTILITY
      service_type: CCN_TYPE
    notes: >-
      WATER ONLY. Probed 2026-09-23: TYPE is uniformly 1 and CCN_TYPE uniformly
      "Bounded Service Area" across all 127 features. There is no sewer
      attribute here.

  sewer_ccn:
    source_id: S19
    acquisition: MANUAL
    target: SewerCCN
    service: null
    portal: https://www.puc.texas.gov/industry/water/utilities/gis.aspx
    provider: Public Utility Commission of Texas
    dataset: Sewer CCN service areas
    status: NOT_AVAILABLE_AS_SERVICE
    notes: >-
      No statewide sewer-CCN feature service was located on 2026-09-23. TCEQ
      publishes none, and every sewer-CCN service found belongs to an
      individual city republishing its own extract (Celina, Anna, Converse,
      Leander, Waxahachie, Bryan). The authoritative source is the PUC of Texas
      GIS download, which is a hand-fetched shapefile.
      CONSEQUENCE: the screening rule require_sewer_ccn_or_within_miles cannot
      be evaluated in this slice and is reported as SKIPPED rather than silently
      passed. See D-016.

  land_cover:
    source_id: S17
    acquisition: AUTO
    target: LandCover_NLCD
    service: https://www.mrlc.gov/geoserver/mrlc_display/wcs
    protocol: WCS
    coverage_id: mrlc_display__NLCD_2021_Land_Cover_L48
    provider: MRLC
    dataset: NLCD 2021 Land Cover (CONUS)
    license: Public domain
    native_crs: 5070            # NLCD is Albers Equal Area CONUS
    service_crs: 3857           # but GeoServer PUBLISHES the coverage in 3857
    subsetting_crs: 4326        # so subset in lat/lon and let the server convert
    output_crs: 5070            # and demand Albers back - see notes
    subset_axes: [Long, Lat]
    notes: >-
      The Esri and USGS NLCD ImageServers both require a token. MRLC's WCS is
      open and serves the same product; 2021 is the latest Land_Cover_L48
      coverage published there.

      The coverage is published in EPSG:3857, not in NLCD's native Albers, and
      GeoServer cannot ENCODE a GeoTIFF in Pseudo-Mercator - a GetCoverage
      without `outputCrs` returns HTTP 500 "Unable to map projection Popular
      Visualisation Pseudo Mercator". Subsetting in 4326 and asking for 5070
      back avoids both problems and returns the grid in an equal-area
      projection, which is the right one for measuring land-cover proportion.

  elevation:
    source_id: S16
    acquisition: AUTO
    target: Slope_pct
    service: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
    protocol: ImageServer
    provider: USGS
    dataset: 3DEP Elevation (1/3 arc-second)
    license: Public domain
    native_crs: 4269
    pixel_type: F32
    export_cell_size_m: 10
    vertical_units: meters       # 3DEP elevation values are METRES
    z_factor_to_xy: 3.28084      # ...but EPSG:6584 measures x/y in US ft
    max_export_px: 8000          # the service's own maxImageWidth/Height
    export_chunk_px: 1024        # ...but it gateway-times-out well below that
    export_retries: 3
    notes: >-
      Exported directly in the analysis CRS via the ImageServer `exportImage`
      REST endpoint. `MakeImageServerLayer` + `CopyRaster` silently produced a
      1 x 1 raster here, which would have made every slope unmeasurable and -
      because an unmeasurable metric is Review, not Pass - quietly flooded the
      shortlist with unscreened parcels. An explicit bbox and pixel size is
      verifiable; a layer handle is not.

      Slope is computed in the projected CRS, never in geographic coordinates.
      The z-factor matters as much: elevation is in metres and x/y in US survey
      feet, so an unscaled PERCENT_RISE would understate every slope by 3.28x
      and pass terrain that should fail.

  interchanges:
    source_id: S05
    acquisition: AUTO
    target: Interchanges
    service: https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/Roadway_Inventory_2023/FeatureServer/0
    provider: TxDOT
    dataset: Roadway Inventory 2023 (RHiNo)
    license: Public domain
    native_crs: 4326
    observed_features_statewide: 908702
    page_size: 1000
    out_fields: [RIA_RTE_ID, HWY, F_SYSTEM, RU_F_SYSTEM, HSYS]
    derive:
      # FHWA functional system: 1 = Interstate, 2 = Other Freeway / Expressway.
      limited_access_f_system: [1, 2]
      method: intersections_of_limited_access_centerlines

  buildings:
    source_id: S18
    acquisition: AUTO
    target: IndustrialBuildings
    service: https://mapit.tarrantcounty.com/arcgis/rest/services/Dynamic/Building_Footprint/MapServer/0
    provider: Tarrant County GIS
    dataset: Building footprints
    license: Public domain
    native_crs: 2276
    page_size: 1000
    tiles: 6
    max_offset: 2000
    out_fields: []
    notes: >-
      Ingested now for criterion C11 in Part 3. NOT used in screening.
      Footprints carry no use attribute; industrial classification is derived
      later and its method must be stated in the report.

sources:

  # ---------------------------------------------------------------- Cadastral
  - source_id: S01
    category: Parcels
    dataset: StratMap Land Parcels (11 DFW counties)
    provider: Texas Geographic Information Office (TxGIO, formerly TNRIS)
    portal: https://data.tnris.org/
    endpoint: null
    verify_endpoint: true
    license: Public domain / open data (confirm per county)
    format: shapefile
    target: Parcels
    fallback:
      note: >-
        County appraisal districts where StratMap coverage is stale or absent -
        TAD (Tarrant), DCAD (Dallas), CCAD (Collin), Denton CAD, Ellis CAD,
        Johnson CAD, Kaufman CAD, Parker CAD, Rockwall CAD, Hunt CAD, Wise CAD.
    # PER-COUNTY ONLY. There is deliberately no `_default` block: the 11
    # appraisal districts publish independently and share no schema. The
    # original guessed default (PROP_ID / LAND_STATE / LAND_VAL) turned out to
    # be wrong for Tarrant in every field, so guessing is not permitted -
    # IngestAndStandardize refuses to run a county that has no verified map.
    #
    # `status: verified` means the field names were read from the live service.
    # `status: skeleton` means the endpoint is known but the fields are not yet
    # confirmed; ingest will refuse until it is promoted to verified.
    counties:

      tarrant:
        status: verified
        verified_on: "2026-09-19"
        acquisition: AUTO
        endpoint: https://mapit.tarrantcounty.com/arcgis/rest/services/Dynamic/TADParcels/MapServer/0
        native_crs: 3785
        expected_feature_count: 758633
        feature_count_tolerance_pct: 5
        max_record_count: 1000          # paging is mandatory
        field_map:
          # ACCOUNT, not TAXPIN. Verified over a 20,000-record sample: ACCOUNT
          # is 100% unique, TAXPIN only 98.44% - it identifies the survey
          # abstract tract, and one tract can hold several appraised parcels.
          parcel_id:           ACCOUNT
          alt_parcel_id:       TAXPIN
          owner_name:          OWNER_NAME
          situs_addr:          SITUS_ADDR
          city:                CITY
          acres_published:     LAND_ACRES
          appraised_land_val:  LAND_VALUE
          appraised_total_val: TOTAL_VALU
          year_built:          YEAR_BUILT
        unavailable:
          # Verified absent from the TAD schema (recon 1.5). Declared explicitly
          # so a null here is a known fact rather than a silent mapping failure.
          - land_use_code
          - land_use_class
          - zoning_code
          - zoning_class
        notes: >-
          Do not confuse with Tax/TCProperty - identical 56-field schema, 110
          county-owned features only. The feature count identifies the layer.

      # ------------------------------------------------------------------
      # Every `portal` below returns HTTP 200 as of 2026-09-22, but whether it
      # actually offers a downloadable parcel layer is UNCONFIRMED - the URL
      # resolving is not the same as the data being there.
      #
      # The remaining ten counties. Probed 2026-09-22; NONE is cleared for
      # ingest. `skeleton` means the endpoint and field names are recorded but
      # the semantics are unconfirmed, and assert_ready_to_ingest refuses it.
      # ------------------------------------------------------------------

      denton:
        status: skeleton
        probed_on: "2026-09-22"
        acquisition: AUTO
        endpoint: https://gis.dentoncounty.gov/arcgis/rest/services/Parcels_FC/MapServer/0
        publisher: Denton County GIS
        expected_feature_count: 384308
        feature_count_tolerance_pct: 5
        field_count: 71
        has_land_value: true
        has_acreage: true
        field_map:
          parcel_id:           pid
          alt_parcel_id:       geoID
          owner_name:          name
          situs_addr:          situs_full_address
          city:                situsCity
          acres_published:     legalAcreage
          appraised_total_val: ownerAppraisedValue
          year_built:          imprvActualYearBuilt
          # cad_zoning is rare - most counties publish nothing of the kind.
          zoning_code:         cad_zoning
        to_confirm:
          # Land value is split homestead / non-homestead. Whether
          # appraised_land_val = landHSValue + landNHSValue must be confirmed
          # against the CAD's own documentation before this is promoted.
          - "appraised_land_val: landHSValue + landNHSValue (sum unconfirmed)"
          - "legalAcreage vs effectiveSizeAcres - which is the deeded figure"
          - "cad_zoning value domain and how populated it actually is"
        notes: >-
          Richest schema found so far - 71 fields, and the only county located
          that publishes a zoning field at all. Promote to verified once the
          land-value composition is confirmed.

      dallas:
        status: skeleton
        probed_on: "2026-09-22"
        acquisition: AUTO
        endpoint: https://services2.arcgis.com/rwnOSbfKSwyTBcwN/arcgis/rest/services/CurrentDcadParcels/FeatureServer/0
        publisher: City of Dallas GIS Services (DCAD parcels)
        expected_feature_count: 695446
        feature_count_tolerance_pct: 5
        field_count: 5
        has_land_value: false
        has_acreage: partial
        requires_roll_join: true
        field_map:
          alt_parcel_id:   GIS_Acct
          acres_published: RecAcs
        unavailable:
          - appraised_land_val
          - appraised_total_val
          - owner_name
          - situs_addr
          - year_built
          - land_use_code
          - zoning_code
        to_confirm:
          - "Source of the DCAD tabular roll and the join key (GIS_Acct)"
          - "Whether RecAcs is deeded acreage or a GIS calculation"
          - "A parcel_id - GIS_Acct may be the only identifier published"
        notes: >-
          GEOMETRY AND ACCOUNT NUMBER ONLY - five fields. This is the case
          D-008 assumed would not arise: C10 cannot be computed for Dallas
          County from the parcel layer alone, and a DCAD roll join is required.
          Dallas is the second-largest county in the study area, so this is a
          material gap rather than an edge case. See D-014.

      collin:      {status: not_located, acquisition: MANUAL, probed_on: "2026-09-22",
                    portal: https://www.collincad.org/, notes: "No queryable county service located. Try Collin CAD / Collin County open data."}
      ellis:       {status: not_located, acquisition: MANUAL, probed_on: "2026-09-22",
                    portal: https://www.elliscad.com/, notes: "No queryable county service located."}
      hunt:        {status: not_located, acquisition: MANUAL, probed_on: "2026-09-22",
                    portal: https://www.hunt-cad.org/, notes: "No queryable county service located."}
      johnson:     {status: not_located, acquisition: MANUAL, probed_on: "2026-09-22",
                    portal: https://www.johnsoncad.com/, notes: "County ArcGIS server reachable but publishes no parcel service (5 services, none cadastral)."}
      kaufman:     {status: not_located, acquisition: MANUAL, probed_on: "2026-09-22",
                    portal: https://www.kaufman-cad.org/, notes: "No queryable county service located."}
      parker:      {status: not_located, acquisition: MANUAL, probed_on: "2026-09-22",
                    portal: https://www.parkercad.org/, notes: "No queryable county service located."}
      rockwall:    {status: not_located, acquisition: MANUAL, probed_on: "2026-09-22",
                    portal: https://www.rockwallcad.com/, notes: "No queryable county service located."}
      wise:        {status: not_located, acquisition: MANUAL, probed_on: "2026-09-22",
                    portal: https://www.wisecad.org/, notes: "No queryable county service located."}
    notes: >-
      Largest dataset in the project - expect millions of polygons across 11
      counties. Ingest clips to the MSA + 15-mile buffer before loading.

  - source_id: S02
    category: Zoning
    dataset: Municipal zoning (city open-data portals)
    provider: Individual municipalities
    portal: null
    endpoint: null
    verify_endpoint: true
    license: Varies by city
    format: mixed
    target: Zoning
    cities:
      # Confirmed-publishing cities are filled in during Week 1. Cities with no
      # open zoning layer fall back to parcel land-use + NLCD and are flagged
      # screen_status = Review (config/screening.yaml -> zoning.fallback).
      - {name: Fort Worth,    portal: null, status: unverified}
      - {name: Dallas,        portal: null, status: unverified}
      - {name: Arlington,     portal: null, status: unverified}
      - {name: Irving,        portal: null, status: unverified}
      - {name: Grand Prairie, portal: null, status: unverified}
      - {name: Burleson,      portal: null, status: unverified}
      - {name: Lancaster,     portal: null, status: unverified}
      - {name: Mesquite,      portal: null, status: unverified}
      - {name: Denton,        portal: null, status: unverified}
      - {name: Frisco,        portal: null, status: unverified}
      - {name: McKinney,      portal: null, status: unverified}
    notes: >-
      HIGHEST SCHEDULE RISK in the project. No authoritative regional zoning
      layer exists; coverage is city-by-city with inconsistent schemas, and
      unincorporated county land has no zoning at all. Attack this first.

  # ----------------------------------------------------------- Transportation
  - source_id: S03
