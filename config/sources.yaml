  # ------------------------------------------------------------ Demographics
  - source_id: S08
    category: Demographics
    dataset: ACS 5-year estimates, block group
    provider: US Census Bureau
    portal: https://www.census.gov/data/developers/data-sets/acs-5year.html
    endpoint: https://api.census.gov/data/{year}/acs/acs5
    verify_endpoint: false
    license: Public domain
    format: census_api
    target: BlockGroups_ACS
