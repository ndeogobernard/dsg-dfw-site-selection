# =============================================================================
# Phase A - candidate screening thresholds (scope Section 5.1, Appendix B).
# Every value here is a [parameter] in the scope and is echoed into
# ScoreRuns.parameters_json so any run can be reconstructed exactly.
# =============================================================================

# --- Appendix B defaults (do not edit casually; add a variant below instead) ---
min_acres: 80
max_parcels_per_assemblage: 6
# allow_agricultural_near_industrial_miles: removed by D-013 Q1 - it only
# existed to rescue agricultural land from the industrial-zoning gate,
# and there is no longer a gate to rescue it from.
max_sfha_pct: 20
max_floodway_pct: 0
max_wetland_pct: 10
max_mean_slope_pct: 5
max_developed_pct: 30
require_water_ccn: true
require_sewer_ccn_or_within_miles: 1.0
max_truck_min_to_interchange: 15

# --- Assemblage construction (5.1 step 1) ---
assemblage:
  # [DECISION] owner-based vs zoning-based dissolve. Default: owner, falling back
  # to zoning_class where owner_name is null or generic. Recorded in
  # ParcelAssemblages.method and in the methodology report.
  method: owner
  fallback_method: zoning
  require_contiguity: true
  manual_review_acres_over: 300

# --- Zoning (D-013 Q1: NOT a hard filter) --------------------------------------
# Screening is physical and infrastructural only. Zoning was demoted because it
# is unobtainable for a large share of the study area: parcels carry none,
# coverage is city-by-city, and unincorporated Texas land has no zoning by law.
# Gating on it silently discarded exactly the cheap highway-adjacent greenfield
# land a DC would realistically buy (D-009, recon 1.5 / 2.2).
#
# Industrial context now lives in SCORING - criterion C11 (industrial cluster)
# plus C12 (zoning and entitlement signal), see config/criteria.yaml.
zoning:
  hard_filter: false
  # The ONLY zoning-based exclusion that survives: a parcel whose zoning is
  # confirmed by an authoritative municipal layer to be a non-industrial,
  # non-agricultural class. Confirmed residential land is genuinely out.
  # Everything else - inferred, unzoned, unknown - is carried into scoring.
  exclude_confirmed_non_industrial: true
  never_excluded_confidences: [Inferred, Unzoned, Unknown]
  excludable_classes_when_confirmed:
    - Residential
    - MixedUse
  # Tier assignment for zoning_confidence (schema domain dm_ZoningConfidence).
  confidence_rules:
    Confirmed: authoritative municipal zoning layer intersects the parcel
    Inferred:  no zoning layer, but land use / NLCD / NCTCOG support the reading
    Unzoned:   parcel falls outside any incorporated place
    Unknown:   inside an incorporated place that publishes no usable layer
  # Parcels that are not Confirmed get screen_status = Review, so the shortlist
  # always shows how much entitlement uncertainty it carries.
  non_confirmed_screen_status: Review

# --- NLCD classes counted as "already built out" (5.1 max_developed_pct) ---
nlcd_developed_classes: [23, 24]      # 23 = Developed Medium, 24 = Developed High

# --- SFHA zones counted toward max_sfha_pct ---
sfha_zones: [A, AE, AH, AO]

# --- Auto-relaxation ladder (5.1 step 3) -------------------------------------
# The scope requires 60-200 Pass candidates. If the first pass falls outside
# that band the tool re-runs with the adjusted parameter and records the final
# values used.
candidate_band:
  min: 60
  max: 200
  if_below_min:
    min_acres: 70
  if_above_max:
    max_truck_min_to_interchange: 10
  max_iterations: 3

# --- Threshold sensitivity sweep (5.6 item 3) --------------------------------
threshold_sensitivity:
  min_acres: [70, 80, 100]
  max_truck_min_to_interchange: [10, 15, 20]
