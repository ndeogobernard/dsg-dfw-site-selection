# -----------------------------------------------------------------------------
# 4.5 Topology
# -----------------------------------------------------------------------------
topologies:
  - name: Cadastral_Topology
    dataset: Cadastral
    cluster_tolerance: 0.1        # feet
    feature_classes: [Parcels, ParcelAssemblages]
    rules:
      - {rule: "Must Not Overlap (Area)",   origin: Parcels}
      - {rule: "Must Not Have Gaps (Area)", origin: Parcels}
      - {rule: "Must Not Overlap (Area)",   origin: ParcelAssemblages}

# -----------------------------------------------------------------------------
# 4.5 Attribute rules
# -----------------------------------------------------------------------------
attribute_rules:
  - name: calc_Parcel_Acres
    table: Parcels
    type: CALCULATION
    field: acres
    triggers: [INSERT, UPDATE]
    script: "return $feature.Shape_Area / 43560;"
    description: Acreage derived from geometry (analysis CRS is US survey feet).

  - name: calc_Parcel_AcresDelta
    table: Parcels
    type: CALCULATION
    field: acres_delta_pct
    triggers: [INSERT, UPDATE]
    script: "if (IsEmpty($feature.acres_published) || $feature.acres_published <= 0 || IsEmpty($feature.acres)) { return null; } return Abs($feature.acres - $feature.acres_published) / $feature.acres_published * 100;"
    description: >-
      Percentage disagreement between geometry-derived acreage and the acreage
      the appraisal district publishes. D-008 screens on the published value;
      this makes the divergence visible instead of reconciling it away.

  - name: calc_Parcel_LandValPerAcre
    table: Parcels
    type: CALCULATION
    field: land_val_per_acre
    triggers: [INSERT, UPDATE]
    script: "if (IsEmpty($feature.acres) || $feature.acres <= 0) { return null; } return $feature.appraised_land_val / $feature.acres;"
    description: Appraised land value normalized per acre.

  - name: calc_Assemblage_Acres
    table: ParcelAssemblages
    type: CALCULATION
    field: acres
    triggers: [INSERT, UPDATE]
    script: "return $feature.Shape_Area / 43560;"
    description: Assemblage acreage derived from dissolved geometry.

  - name: cons_SiteScores_Composite
    table: SiteScores
    type: CONSTRAINT
    triggers: [INSERT, UPDATE]
    script: "return IsEmpty($feature.composite) || ($feature.composite >= 0 && $feature.composite <= 100);"
    error_number: 1001
    error_message: "composite must be between 0 and 100"
    description: Composite score must fall in the normalized range.

  - name: cons_SiteScores_Rank
    table: SiteScores
    type: CONSTRAINT
    triggers: [INSERT, UPDATE]
    script: "return IsEmpty($feature.rank) || $feature.rank >= 1;"
    error_number: 1002
    error_message: "rank must be >= 1"
    description: Rank is 1-based.
