    backward_label: from run

  - name: rel_Run_Sensitivity
    origin: ScoreRuns
    destination: SensitivityResults
    cardinality: ONE_TO_MANY
    primary_key: run_id
    foreign_key: run_id
    forward_label: produced sensitivity
