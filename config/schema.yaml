    foreign_key: source_id
    forward_label: sources
    backward_label: sourced from

  - name: rel_Source_Stores
    origin: DataSourceRegistry
    destination: Stores_DSG
    cardinality: ONE_TO_MANY
    primary_key: source_id
    foreign_key: source_id
    forward_label: sources
    backward_label: sourced from

  - name: rel_Candidate_Shortlist
    origin: CandidateSites
    destination: Shortlist
